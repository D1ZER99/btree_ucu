[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "btree-store"
version = "0.1.0"
description = "Persistent copy-on-write B+-tree key-value store"
readme = "DESIGN.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["btree*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
